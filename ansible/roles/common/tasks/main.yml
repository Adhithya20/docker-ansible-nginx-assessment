---
- name: Update apt package cache
  become: true
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common packages
  become: true
  apt:
    name:
      - curl
      - git
      - sudo
    state: present

- import_tasks: user.yml

- import_tasks: ansible_key.yml

- name: Verify vaulted secret is available
  debug:
    msg: "Vault secret loaded successfully"
